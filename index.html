<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromos</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="public/css/main.css">
</head>

<body>

    <div class="main-container">
        <div class="card-neon">
            <h1 class="titulo-neon">Verificador de Palíndromos</h1>
            <p class="descripcion">Escribe una palabra o frase y descubre si se lee igual al revés</p>

            <input type="text" id="datos" class="input-text" placeholder="Ejemplo: Anita lava la tina">

            <button id="generar" class="btn-neon">Verificar</button>
        </div>
    </div>

    <script src="./bundle.js"></script>
</body>

</html>
